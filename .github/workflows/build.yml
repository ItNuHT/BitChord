name: Build APK

# Two ways to run this from your phone:
# - Automatically on every push to main
# - Manually: repo → Actions tab → "Build APK" → "Run workflow" button
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Speeds up repeat builds a lot — safe to keep even on first run
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Debug build = auto-signed with a throwaway debug key, installable
      # straight away. No keystore setup needed for this path.
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-debug-apk
          # Adjust this glob if your module isn't named "app"
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
